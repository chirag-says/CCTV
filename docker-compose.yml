# ============================================================================
# AI CCTV Surveillance System — Docker Compose
# ============================================================================

version: "3.9"

services:
  # ── Backend API Server ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cctv-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # go2rtc runs as its own service below, so the backend generates the
      # config and does not start or supervise the process.
      - GO2RTC_MANAGED=false
      - GO2RTC_INTERNAL_URL=http://host.docker.internal:1984
      - GO2RTC_PUBLIC_URL=http://localhost:1984
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/snapshots:/app/snapshots
      - ./backend/config:/app/config # go2rtc.yaml is generated in here
      - /dev/video0:/dev/video0 # Webcam passthrough (Linux)
    devices:
      - /dev/video0:/dev/video0 # Camera access
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Live-view relay (go2rtc) ───────────────────────────────
  # Video does NOT pass through the backend. go2rtc pulls each camera's RTSP
  # and hands the browser WebRTC directly; the backend sends detection
  # metadata only. Its config is generated by the backend from the cameras
  # table into ./backend/go2rtc.yaml, which is mounted here read-only, so the
  # relay's stream list cannot drift from the camera list.
  #
  # GO2RTC_MANAGED=false in the backend's env: this compose service owns the
  # process, so the backend writes the config and leaves the process alone.
  # The image ships ffmpeg, which is what makes file cameras work in dev.
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: cctv-go2rtc
    network_mode: host # WebRTC needs the host's own address to be a valid
                       # ICE candidate; behind a bridge every candidate is a
                       # container IP the browser cannot reach.
    volumes:
      - ./backend/config:/config:ro # holds the generated go2rtc.yaml
      - ./backend/uploads:/app/uploads:ro # dev file cameras, looped by ffmpeg
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:1984/api/streams" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend (Next.js) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cctv-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
      - go2rtc
    restart: unless-stopped
